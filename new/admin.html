<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Fauji Dhaba - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #d4af37;
            --secondary: #8b0000;
            --accent: #c19e1c;
            --dark: #222;
            --light: #f8f8f8;
            --success: #28a745;
            --danger: #dc3545;
            --info: #17a2b8;
            --warning: #ffc107;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.15);
            --card-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        /* Dark Mode Variables */
        [data-theme="dark"] {
            --dark: #f0f0f0;
            --light: #1a1a1a;
            --secondary: #a52a2a;
            --card-bg: #222;
            --text-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), 
                        url('https://images.unsplash.com/photo-1547573854-74d2a71d0826?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80') 
                        no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--dark);
            line-height: 1.6;
            transition: var(--transition);
        }

        body[data-theme="dark"] {
            background: linear-gradient(rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.9)), 
                        url('https://images.unsplash.com/photo-1547573854-74d2a71d0826?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80') 
                        no-repeat center center fixed;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: var(--shadow);
            padding: 25px;
            width: 100%;
            max-width: 1200px;
            border: 2px solid var(--primary);
            display: flex;
            flex-direction: column;
            min-height: 90vh;
            transition: var(--transition);
        }

        body[data-theme="dark"] .container {
            background-color: rgba(30, 30, 30, 0.95);
            color: var(--text-color);
            border-color: var(--accent);
        }

        /* Header Styles */
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 10px;
            background: linear-gradient(to right, var(--secondary), #6b0000);
            color: white;
            box-shadow: var(--shadow);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            overflow: hidden;
        }

        .header::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23d4af37' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
            opacity: 0.2;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, var(--primary), #f1c40f);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            border: 3px solid white;
        }

        .header-content {
            z-index: 2;
        }

        .header h1 {
            margin: 0;
            font-size: 2.8rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            font-family: 'Baloo Bhai 2', cursive;
            letter-spacing: 1px;
        }

        .subtitle {
            font-style: italic;
            margin-top: 8px;
            font-size: 1.2rem;
            opacity: 0.9;
            color: var(--primary);
            font-weight: 500;
        }

        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 1.2rem;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(20deg);
        }

        .admin-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .admin-btn {
            padding: 12px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }

        .download-btn {
            background: var(--success);
            color: white;
        }

        .clear-btn {
            background: var(--danger);
            color: white;
        }

        .search-orders {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-orders input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 30px;
            font-size: 16px;
            background-color: white;
            transition: var(--transition);
        }

        body[data-theme="dark"] .search-orders input {
            background-color: #333;
            border-color: #555;
            color: #eee;
        }

        .search-orders i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
        }

        .orders-list {
            max-height: 60vh;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 15px;
            background: white;
        }

        body[data-theme="dark"] .orders-list {
            border-color: #444;
            background: #2a2a2a;
        }

        .order-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #f9f9f9;
        }

        body[data-theme="dark"] .order-item {
            background: #333;
            border-color: #444;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--secondary);
        }

        .order-details {
            margin-bottom: 10px;
        }

        .order-items {
            margin-left: 20px;
        }

        .order-item-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .order-total {
            font-weight: 700;
            border-top: 1px dashed #ccc;
            padding-top: 10px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
        }

        .no-orders {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        body[data-theme="dark"] .no-orders {
            color: #999;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 28px;
            border-radius: 8px;
            background-color: var(--success);
            color: white;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            transform: translateX(150%);
            transition: transform 0.3s ease-in-out;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notification.show {
            transform: translateX(0);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        body[data-theme="dark"] ::-webkit-scrollbar-track {
            background: #333;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #c9a227;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .admin-controls {
                flex-direction: column;
            }
            
            .search-orders {
                min-width: 100%;
            }
        }

        @media (max-width: 576px) {
            .container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .admin-btn {
                padding: 10px 15px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <!-- <a href="index.html" class="back-to-main">
                <i class="fas fa-arrow-left"></i>
            </a> -->
            <div class="logo">🍛</div>
            <div class="header-content">
                <h1>New Fauji Dhaba</h1>
                <div class="subtitle">Admin Panel - Order Management</div>
            </div>
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
        </div>
        
        <div class="admin-controls">
            <button class="admin-btn download-btn" id="downloadOrders">
                <i class="fas fa-download"></i> Download Orders
            </button>
            <button class="admin-btn clear-btn" id="clearOrders">
                <i class="fas fa-trash"></i> Clear All Orders
            </button>
            <div class="search-orders">
                <i class="fas fa-search"></i>
                <input type="text" id="searchOrders" placeholder="Search orders...">
            </div>
        </div>
        
        <div class="orders-list" id="ordersList">
            <div class="no-orders">
                <i class="fas fa-receipt"></i>
                <p>No orders yet</p>
                <p>Orders will appear here</p>
            </div>
        </div>
    </div>
    
    <div class="notification" id="notification">
        <i class="fas fa-check-circle"></i>
        <span id="notificationText">Operation completed successfully!</span>
    </div>
    
    <script>

if (sessionStorage.getItem('authenticated') !== 'true') {
    window.location.href = 'login.html';
}

        // DOM elements
        const ordersList = document.getElementById('ordersList');
        const downloadOrdersBtn = document.getElementById('downloadOrders');
        const clearOrdersBtn = document.getElementById('clearOrders');
        const searchOrdersInput = document.getElementById('searchOrders');
        const notification = document.getElementById('notification');
        const notificationText = document.getElementById('notificationText');
        const themeToggle = document.getElementById('themeToggle');

        // Load orders from localStorage
        function loadOrders() {
            const orders = JSON.parse(localStorage.getItem('faujiDhabaOrders')) || [];
            renderOrders(orders);
            return orders;
        }

        // Render orders in admin panel
        function renderOrders(orders) {
            ordersList.innerHTML = '';
            
            if (orders.length === 0) {
                ordersList.innerHTML = `
                    <div class="no-orders">
                        <i class="fas fa-receipt"></i>
                        <p>No orders yet</p>
                        <p>Orders will appear here</p>
                    </div>
                `;
                return;
            }
            
            // Reverse to show newest first
            const reversedOrders = [...orders].reverse();
            
            reversedOrders.forEach((order, index) => {
                const orderItem = document.createElement('div');
                orderItem.className = 'order-item';
                
                const orderDate = new Date(order.date);
                const formattedDate = orderDate.toLocaleDateString('en-IN', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                let itemsHtml = '';
                order.items.forEach(item => {
                    itemsHtml += `
                        <div class="order-item-row">
                            <span>${item.quantity} × ${item.name}</span>
                            <span>₹${(item.price * item.quantity).toFixed(2)}</span>
                        </div>
                    `;
                });
                
                orderItem.innerHTML = `
                    <div class="order-header">
                        <span>Order #${orders.length - index}</span>
                        <span>${formattedDate}</span>
                    </div>
                    <div class="order-details">
                        <div><strong>Customer:</strong> ${order.customerName || 'Not specified'}</div>
                        <div><strong>Table:</strong> ${order.tableNo}</div>
                        <div><strong>Phone:</strong> ${order.customerPhone || 'Not provided'}</div>
                    </div>
                    <div class="order-items">
                        ${itemsHtml}
                    </div>
                    <div class="order-total">
                        <span>Total:</span>
                        <span>₹${order.total.toFixed(2)}</span>
                    </div>
                    ${order.specialInstructions ? `<div><strong>Special Instructions:</strong> ${order.specialInstructions}</div>` : ''}
                `;
                
                ordersList.appendChild(orderItem);
            });
        }

        // Download orders as JSON file
        function downloadOrders() {
            const orders = JSON.parse(localStorage.getItem('faujiDhabaOrders')) || [];
            if (orders.length === 0) {
                showNotification('No orders to download');
                return;
            }
            
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(orders, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "fauji_dhaba_orders.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
            
            showNotification('Orders downloaded successfully');
        }

        // Clear all orders
        function clearOrders() {
            if (confirm('Are you sure you want to clear all orders? This action cannot be undone.')) {
                localStorage.removeItem('faujiDhabaOrders');
                renderOrders([]);
                showNotification('All orders cleared');
            }
        }

        // Search orders
        function searchOrders(query) {
            const orders = JSON.parse(localStorage.getItem('faujiDhabaOrders')) || [];
            if (!query) {
                renderOrders(orders);
                return;
            }
            
            const filteredOrders = orders.filter(order => 
                order.customerName?.toLowerCase().includes(query.toLowerCase()) ||
                order.tableNo.toString().includes(query) ||
                order.customerPhone?.includes(query) ||
                order.items.some(item => item.name.toLowerCase().includes(query.toLowerCase()))
            );
            
            renderOrders(filteredOrders);
        }

        // Show notification
        function showNotification(message) {
            notificationText.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Toggle theme
        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            
            // Update icon
            themeToggle.innerHTML = newTheme === 'dark' ? 
                '<i class="fas fa-sun"></i>' : 
                '<i class="fas fa-moon"></i>';
            
            // Save theme preference
            localStorage.setItem('theme', newTheme);
        }

        // Initialize the admin panel
        function init() {
            loadOrders();
            
            // Set up event listeners
            downloadOrdersBtn.addEventListener('click', downloadOrders);
            clearOrdersBtn.addEventListener('click', clearOrders);
            searchOrdersInput.addEventListener('input', (e) => {
                searchOrders(e.target.value);
            });
            themeToggle.addEventListener('click', toggleTheme);
        }

        // Initialize the admin panel
        init();

        // Check for saved theme preference
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.body.setAttribute('data-theme', savedTheme);
            themeToggle.innerHTML = savedTheme === 'dark' ? 
                '<i class="fas fa-sun"></i>' : 
                '<i class="fas fa-moon"></i>';
        }
    </script>
</body>
</html>
